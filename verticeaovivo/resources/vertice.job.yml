# Job vertice_farol: seis tarefas no fluxo operacional:
# ingestao_feriados e ingestao_data_lake carregam fontes em paralelo;
# conferencia_bronze valida as nove tabelas bronze;
# medalhao atualiza as camadas silver e gold;
# testes_de_qualidade valida contratos e indicadores;
# status_com_ia enriquece incrementalmente os textos de status.
resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      tasks:
        - task_key: ingestao_feriados
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/ingestao/01_ingestao_api_gabarito.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: ingestao_data_lake
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_DEFAULT_REGION: us-east-1
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://shiivuzdswormlzgitkl.storage.supabase.co/storage/v1/s3
            notebook_path: ../src/ingestao/02_ingestao_boto3_gabarito.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            file:
              path: ../src/testes/testes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: status_com_ia
          depends_on:
            - task_key: medalhao
          sql_task:
            file:
              path: ../src/ia/status_estruturado.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      schedule:
        pause_status: PAUSED
        quartz_cron_expression: 10 0 6 ? * MON
        timezone_id: America/Sao_Paulo
      timeout_seconds: 0
      webhook_notifications: {}
